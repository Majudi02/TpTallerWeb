<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Detalle Pedido | NutriYa</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.2.0/css/bootstrap.min.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/estilo-principal.css}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>

<main class="d-flex flex-column align-items-center gap-5" style="margin-top: 100px;">
  <div class="card w-75 p-4 shadow mx-auto">
    <h2 class="titulo-verde mb-4">Detalle Pedido #<span th:text="${pedido.pedidoId}"></span></h2>

    <div class="mb-4">
      <h5>Restaurante</h5>
      <p class="mb-1"><strong>Nombre:</strong> <span th:text="${pedido.nombreRestaurante}"></span></p>
      <p class="mb-0"><strong>Dirección:</strong> <span th:text="${pedido.direccionRestaurante}"></span></p>
    </div>

    <div class="mb-4">
      <h5>Cliente</h5>
      <p class="mb-0"><strong>Dirección:</strong> <span th:text="${pedido.direccionCliente}"></span></p>
    </div>

    <div class="mb-4">
      <h5>Platos</h5>
      <ul class="list-group rounded-4 shadow-sm">
        <li class="list-group-item d-flex justify-content-between" th:each="plato : ${pedido.platos}">
          <span th:text="${plato.nombre}"></span>
          <span class="badge bg-success rounded-pill" th:text="${plato.cantidad}"></span>
        </li>
      </ul>
    </div>
<div class = "mb-4">
  <p>  Tiempo de entrega estimado: <span class="badge bg-primary"> 15 minutos </span></p>
</div>
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">

      <a href="/pedidos-retirar"
         class="btn btn-outline-secondary py-1 px-2 small d-flex align-items-center gap-1"
         style="min-width: 100px;">
        <i class="bi bi-arrow-left-circle"></i> Volver
      </a>

      <div class="d-flex flex-column flex-md-row gap-2">
        <button class="btn btn-outline-primary py-1 px-3 small" style="min-width: 130px;" onclick="abrirChat()">
          <i class="bi bi-chat-dots"></i> Chatear
        </button>

        <form th:action="@{'/pedido/entregar/' + ${pedido.pedidoId}}" method="post">
          <button type="submit"
                  class="btn btn-success py-3 px-5 fw-bold fs-4"
                  style="min-width: 240px;">
            <i class="bi bi-check-circle"></i> Confirmar
          </button>
        </form>
      </div>

    </div>
  </div>
</main>


<div class="modal fade" id="chatModal" tabindex="-1" aria-labelledby="chatModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content rounded-4 shadow">
      <div class="modal-header">
        <h5 class="modal-title" id="chatModalLabel">Chat con el Cliente</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div id="chat-mensajes" style="max-height: 300px; overflow-y: auto;"></div>
        <div class="input-group mt-3">
          <input id="mensaje-input" type="text" class="form-control" placeholder="Escribí un mensaje...">
          <button class="btn btn-success" onclick="enviarMensaje()">Enviar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script th:src="@{/webjars/bootstrap/5.2.0/js/bootstrap.min.js}"></script>
<!-- Scripts WebSocket -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script th:inline="javascript">
  let remitenteId = [[${repartidorId}]];
  let destinatarioId = [[${clienteId}]];
  let pedidoId = [[${pedidoId}]];
</script>
<script th:src="@{/js/chat-del-repartidor.js}" type="text/javascript"></script>

</body>
</html>
