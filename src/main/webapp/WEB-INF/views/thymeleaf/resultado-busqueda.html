<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Resultados de Búsqueda</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.2.0/css/bootstrap.min.css}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/hacer-pedido-home.css}"/>
    <link rel="stylesheet" th:href="@{/css/plato.css}"/>
    <link rel="stylesheet" th:href="@{/css/estilo-principal.css}"/>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet"/>
    <style>
        .img-plato {
            width: 190px;
            height: 135px;
            object-fit: cover;
            border-radius: 15px;
        }
        .logo-restaurante {
            width: 190px;
            height: 135px;
            object-fit: cover;
            border-radius: 15px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top px-3">
    <div class="container-fluid">
        <div class="d-flex w-100 justify-content-between align-items-center">
            <a class="navbar-brand" th:href="@{/nutriya}">
                Nutri<span style="color: #38BD48;">Ya</span>
            </a>

            <form th:action="@{/buscar}" method="get" class="d-none d-lg-flex mx-auto" role="search" style="width: 40%;"
                  accept-charset="UTF-8">
                <div class="input-group position-relative">
                    <input class="form-control" type="search" name="busqueda" id="busqueda"
                           placeholder="Buscá comidas, restaurantes..."
                           aria-label="Buscar" autocomplete="off"/>
                    <button class="btn buscar" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                    <div id="sugerencias"
                         class="list-group position-absolute w-100"
                         style="top: 100%; z-index: 1000;"></div>
                </div>
            </form>

            <div class="botones-nav">
                <button th:if="${tipoUsuario == 'cliente'}" class="btn btn-outline-secondary mx-1" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#carritoOffcanvas" aria-controls="carritoOffcanvas">
                    <i class="bi bi-cart3"></i>
                </button>
                <a class="btn btn-outline-secondary mx-1" th:href="@{/nutriya-login}">
                    <i class="bi bi-person"></i>
                </a>
                <button class="btn btn-outline-secondary" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#menuLateral" aria-controls="menuLateral">
                    <i class="bi bi-list"></i>
                </button>
            </div>
        </div>
    </div>
</nav>

<main class="container my-5 py-5">
    <div th:if="${mensaje != null}" class="mensaje-error alert alert-danger" role="alert" th:text="${mensaje}"></div>

    <div th:if="${resultado != null}">
        <h2 class="resultado-titulo">Restaurantes encontrados</h2>
        <div class="row row-cols-1 row-cols-md-3 g-4 mt-3" th:if="${!#lists.isEmpty(resultado.restaurantes)}">
            <div class="col" th:each="restaurante : ${resultado.restaurantes}">
                <a th:href="@{'/restaurantes/' + ${restaurante.id}}" class="text-decoration-none">
                    <div class="card d-flex flex-column align-items-center p-2 h-100">
                        <img th:src="@{${restaurante.rutaImagen}}" class="logo-restaurante" alt="Logo restaurante"/>
                        <div class="card-body text-center">
                            <h5 class="card-title main-color" th:text="${restaurante.nombre}"></h5>
                            <p class="card-text text-muted" th:text="${restaurante.descripcion}"></p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(resultado.restaurantes)}" class="text-muted fst-italic">
            No se encontraron restaurantes.
        </p>

        <h2 class="resultado-titulo mt-5">Platos encontrados</h2>
        <div class="d-flex flex-row gap-3 mt-3 justify-content-center flex-wrap plato-container"
             th:if="${!#lists.isEmpty(resultado.platos)}">
            <div class="card pt-2" style="width: 35em" th:each="plato : ${resultado.platos}">
                <div class="d-flex flex-row gap-3 plato p-3">
                    <div class="d-flex flex-column w-75 position-relative">
                        <h5 class="card-title" th:text="${plato.nombre}"></h5>
                        <p th:text="${plato.descripcion}"></p>
                        <div class="mt-2 mb-2">
                            <span class="badge badge-etiqueta me-2"
                                  th:each="etiqueta : ${plato.etiquetas}"
                                  th:text="${etiqueta.nombre}"></span>
                        </div>
                        <div class="mb-2">
                            <span th:if="${plato.precioConDescuento != null}"
                                  class="text-muted text-decoration-line-through me-2">
                                $[[${plato.precio}]]
                            </span>
                            <strong class="card-text"
                                    th:text="${plato.precioConDescuento != null} ? '$' + ${plato.precioConDescuento} : '$' + ${plato.precio}">
                            </strong>
                        </div>
                        <div th:if="${usuario != null}" class="mt-2">
                            <a th:href="@{'/pedido/plato'(id=${plato.id})}" class="btn btn-success me-2">
                                Ver Detalle
                            </a>
                            <form th:action="@{/pedido/agregar}" method="post" class="d-inline agregar-plato-form"
                                  th:attr="data-plato-id=${plato.getId()}"
                                  th:attrappend="data-plato-nombre=${plato.getNombre()}">
                                <input type="hidden" name="platoId" th:value="${plato.getId()}"/>
                                <button type="submit" class="btn btn-success">Agregar</button>
                            </form>
                        </div>
                        <div th:if="${usuario == null}" class="mt-2">
                            <a th:href="@{'/pedido/plato'(id=${plato.id})}" class="btn btn-success me-2">Ver Detalle</a>
                            <a th:href="@{/nutriya-login}" class="btn btn-secondary">Iniciar sesión</a>
                        </div>
                    </div>
                    <div class="d-flex flex-column align-items-center justify-content-between">
                        <a th:href="@{'/pedido/plato'(id=${plato.id})}">
                            <img th:src="@{${plato.imagen}}" class="img-plato" alt="Imagen del plato"/>
                        </a>
                        <div class="star-rating mt-4"
                             th:with="promedio=${plato.calificacionPromedio != null ? plato.calificacionPromedio : 0}">
                            <span th:each="i : ${#numbers.sequence(1,5)}">
                                <i class="fa-star fa"
                                   th:classappend="${i <= promedio ? ' checked' : (i - promedio < 1 ? ' half-checked' : '')}"></i>
                            </span>
                            <span th:text="'(' + ${#numbers.formatDecimal(promedio, 1, 1)} + ')'"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(resultado.platos)}" class="text-muted fst-italic">
            No se encontraron platos.
        </p>
    </div>
    <div th:if="${tipoUsuario == 'cliente'}"
         class="offcanvas offcanvas-end" tabindex="-1" id="carritoOffcanvas" aria-labelledby="carritoLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="carritoLabel">Tu Pedido</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column justify-content-between" style="height: 100%;">
            <ul id="lista-carrito" class="list-group mb-3 flex-grow-1 overflow-auto">

            </ul>
            <div id="resumen-nutricional" class="mb-2" style="font-size: 0.9rem; color: #555;">
                <strong>Valores nutricionales</strong>
                <ul style="list-style-type: none; padding-left: 0; margin: 0;">
                    <li>Calorías: 0</li>
                    <li>Proteínas: 0 g</li>
                    <li>Carbohidratos: 0 g</li>
                    <li>Grasas: 0 g</li>
                </ul>
            </div>
            <div class="d-flex justify-content-between align-items-center border-top pt-3">
                <strong>Total:</strong>
                <span id="precioTotal" class="fs-5">$0.00</span>
            </div>
            <form action="/pedido/confirmar" method="post" class="mt-3">
                <button type="submit" class="btn btn-success w-100 fw-bold">Confirmar Pedido</button>
            </form>
        </div>
    </div>
</main>
<script src="/resources/core/js/carrito.js"></script>
<script type="text/javascript" th:src="@{/webjars/bootstrap/5.2.0/js/bootstrap.min.js}"></script>
<script th:src="@{/js/buscador.js}"></script>
</body>
</html>
